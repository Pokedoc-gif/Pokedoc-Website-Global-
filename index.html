<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéDoc</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<script src="script.js" defer></script>
</head>
<body>
<div id="battleIntro">
  <div class="battle-text" id="battleText"></div>
  <img id="introBlastoise" src="https://play.pokemonshowdown.com/sprites/ani/blastoise.gif" alt="Blastoise">
  <div class="flash"></div>
</div>

<div id="loader">
  <div class="pokeball">
    <div class="center-line"></div>
    <div class="center-button"></div>
  </div>
</div>

<div class="pokedex">
  <div class="logo">PokéDoc</div>
  <button id="darkToggle" type="button">🌙 Toggle Dark Mode</button>

  <div class="auth-box">
    <h3>Trainer Account</h3>
    <p class="auth-subtitle">Sign in or create an account to save your cart.</p>
    <input type="email" id="customerEmail" placeholder="Email address">
    <input type="password" id="customerPassword" placeholder="Password">
    <div class="auth-actions">
      <button type="button" onclick="customerSignIn()">Sign In</button>
      <button type="button" onclick="customerSignUp()">Sign Up</button>
    </div>
    <button type="button" class="auth-logout" onclick="customerSignOut()">Sign Out</button>
    <p id="signedInUser"></p>
  </div>

  <div class="category-tabs" id="categoryTabs">
    <button type="button" class="category-tab active" data-category="all">All</button>
    <button type="button" class="category-tab" data-category="storage">Storage</button>
    <button type="button" class="category-tab" data-category="accessories">Accessories</button>
    <button type="button" class="category-tab" data-category="games">Games</button>
    <button type="button" class="category-tab" data-category="cards">Cards</button>
    <button type="button" class="category-tab" data-category="boxes">Boxes</button>
  </div>

  <div class="screen">
    <div class="container" id="productGrid"></div>

    <div class="cart-box">
      <h3>Your Cart</h3>
      <div id="cartItems" class="cart-items"></div>
      <button type="button" onclick="checkoutCart()">Checkout via WhatsApp</button>
    </div>

    <div id="adminPanel">
      <h3>Admin Dashboard</h3>
      <div id="priceInputs"></div>
      <button type="button" onclick="updatePrices()">Update Prices</button>
      <hr>
      <h3>Customer Requests</h3>
      <button type="button" onclick="loadAdminRequests()">Refresh Requests</button>
      <div id="adminRequests"></div>
    </div>
  </div>
</div>

<section class="switch-wrapper">
  <div class="joycon left-joycon">
    <div class="stick"></div>
    <div class="button small"></div>
    <div class="button small lower"></div>
  </div>

  <div class="switch-screen">
    <div class="power-led"></div>
    <h2>Most Requested Items</h2>

    <div class="request-box">
      <input type="text" id="requestName" placeholder="Item Name">
      <textarea id="requestDetails" placeholder="Details (optional)"></textarea>
      <button type="button" onclick="sendItemRequest()">Submit Request</button>
    </div>

    <div id="mostRequested"></div>
  </div>

  <div class="joycon right-joycon">
    <div class="stick"></div>
    <div class="button"></div>
    <div class="button"></div>
    <div class="button"></div>
    <div class="button"></div>
  </div>
</section>

<footer>
  © 2026 PokéDoc | Not affiliated with Pokémon
  <button type="button" onclick="toggleAdmin()" style="cursor:pointer;">⚙️</button>
</footer>

<button id="topButton" type="button" onclick="scrollToTop()">↑ Top</button>

<script type="module" src="jsfirebase.js"></script>
</body>
</html>
