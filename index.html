<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéDoc</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
<script src="script.js" defer></script>
</head>
<body>
<div id="battleIntro">
  <div class="battle-text" id="battleText"></div>
  <img id="introBlastoise" src="https://play.pokemonshowdown.com/sprites/ani/blastoise.gif" alt="Blastoise">
  <div class="flash"></div>
</div>

<div id="loader">
  <div class="pokeball">
    <div class="center-line"></div>
    <div class="center-button"></div>
  </div>
</div>

<div class="pokedex">
  <div class="logo">PokéDoc</div>
  <button id="darkToggle" type="button">🌙 Toggle Dark Mode</button>

  <div class="screen">
    <div class="container" id="productGrid"></div>

    <div id="adminPanel">
      <h3>Admin Dashboard</h3>
      <div id="priceInputs"></div>
      <button type="button" onclick="updatePrices()">Update Prices</button>
      <hr>
      <h3>Customer Requests</h3>
      <button type="button" onclick="loadAdminRequests()">Refresh Requests</button>
      <div id="adminRequests"></div>
    </div>
  </div>
</div>

<section class="switch-wrapper">
  <div class="joycon left-joycon">
    <div class="stick"></div>
    <div class="button small"></div>
    <div class="button small lower"></div>
  </div>

  <div class="switch-screen">
    <div class="power-led"></div>
    <h2>Most Requested Items</h2>

    <div class="request-box">
      <input type="text" id="requestName" placeholder="Item Name">
      <textarea id="requestDetails" placeholder="Details (optional)"></textarea>
      <button type="button" onclick="sendItemRequest()">Submit Request</button>
    </div>

    <div id="mostRequested"></div>
  </div>

  <div class="joycon right-joycon">
    <div class="stick"></div>
    <div class="button"></div>
    <div class="button"></div>
    <div class="button"></div>
    <div class="button"></div>
  </div>
</section>

<footer>
  © 2026 PokéDoc | Not affiliated with Pokémon
  <button type="button" onclick="toggleAdmin()" style="cursor:pointer;">⚙️</button>
</footer>

<script type="module" src="jsfirebase.js"></script>
</body>
</html>
